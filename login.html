<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coding Chronicles</title>

  <link rel="preload" href="./fonts/Lato-Bold.woff2" as="font" type="font/woff2" crossorigin="anonymous">
  <link rel="preload" href="./fonts/Roboto-Regular.woff2" as="font" type="font/woff2" crossorigin="anonymous">
  
</head>
<body>
    <header class="container">
      <h1>Coding <span>Chronicles</span></h1>

      <div id="header-nav" class="header__nav"></div>
    </header>
    
    <main class="main-login container">

      <form id="form-login" class="form-login" action="#" novalidate>
        <div class="form__block">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">
        </div>

          <div class="form__block">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter a password">
        </div>
        
        <button type="submit">Login</button>
        <p class="form__info">Don't have an account? <button id="open-form-signup" type="button">Signup here</button></p>
      </form>


       <form id="form-sign" class="form-sign" action="#" novalidate>
          <div class="form__block">
              <label for="username">Username:</label>
              <input type="text" id="username" name="username" placeholder="Enter an username">
          </div>

          <div class="form__block">
              <label for="email_signup">Email Address:</label>
              <input type="email" id="email_signup" name="email" placeholder="Enter your email">
          </div>

          <div class="form__block">
              <label for="password_signup">Password:</label>
              <input type="password" id="password_signup" name="password" placeholder="Enter a password">
          </div>

          <div class="form__block">
              <label for="confim_password">Confirm Password:</label>
              <input type="password" id="confim_password" name="confirm_password" placeholder="Confirm password">
          </div>
      
          <button type="submit">Create Account</button>

          <p class="form__info">Already have an account? <button id="open-form-login" type="button">Login here</button></p>
        </form>

    </main>

    <footer class="footer container">
      <p>Developer by <a href="https://github.com/codeRazX" target="_blank">codeRazX</a></p>
    </footer>
</body>
</html>
